<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Recorder & Capture</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="2" y="3" width="20" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
                    <circle cx="8" cy="21" r="1" fill="currentColor"/>
                    <circle cx="16" cy="21" r="1" fill="currentColor"/>
                    <path d="M12 17v4" stroke="currentColor" stroke-width="2"/>
                </svg>
                <h1>Screen Tools</h1>
            </div>
        </header>

        <main class="main">
            <!-- Screen Recording Section -->
            <section class="tool-section">
                <div class="tool-header">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                        <circle cx="12" cy="12" r="3" fill="currentColor"/>
                    </svg>
                    <h2>Screen Recording</h2>
                </div>
                
                <div class="controls">
                    <button id="startRecording" class="btn btn-primary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                            <polygon points="10,8 16,12 10,16" fill="currentColor"/>
                        </svg>
                        Start Recording
                    </button>
                    
                    <button id="stopRecording" class="btn btn-danger" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="6" y="6" width="12" height="12" fill="currentColor"/>
                        </svg>
                        Stop Recording
                    </button>
                </div>

                <div class="recording-status" id="recordingStatus">
                    <span class="status-text">Ready to record</span>
                    <span class="recording-time" id="recordingTime">00:00</span>
                </div>

                <div class="options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="includeAudio" checked>
                        <span class="checkmark"></span>
                        Include microphone audio
                    </label>
                    
                    <label class="checkbox-label">
                        <input type="checkbox" id="includeSystemAudio">
                        <span class="checkmark"></span>
                        Include system audio
                    </label>
                </div>
            </section>

            <!-- Screen Capture Section -->
            <section class="tool-section">
                <div class="tool-header">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="2" fill="none"/>
                        <circle cx="12" cy="13" r="4" stroke="currentColor" stroke-width="2" fill="none"/>
                    </svg>
                    <h2>Screen Capture</h2>
                </div>
                
                <div class="controls">
                    <button id="captureVisible" class="btn btn-secondary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="2" y="3" width="20" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        Capture Visible Tab
                    </button>
                    
                    <button id="captureArea" class="btn btn-secondary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" stroke="currentColor" stroke-width="2" fill="none"/>
                        </svg>
                        Select Area
                    </button>
                </div>

                <div class="capture-options">
                    <label class="select-label">
                        Format:
                        <select id="imageFormat">
                            <option value="png">PNG</option>
                            <option value="jpeg">JPEG</option>
                            <option value="webp">WebP</option>
                        </select>
                    </label>
                    
                    <label class="select-label">
                        Quality:
                        <select id="imageQuality">
                            <option value="1.0">High</option>
                            <option value="0.8" selected>Medium</option>
                            <option value="0.6">Low</option>
                        </select>
                    </label>
                </div>
            </section>

            <!-- Recent Captures -->
            <section class="tool-section">
                <div class="tool-header">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="currentColor" stroke-width="2" fill="none"/>
                        <polyline points="14,2 14,8 20,8" stroke="currentColor" stroke-width="2" fill="none"/>
                    </svg>
                    <h2>Recent Captures</h2>
                </div>
                
                <div id="recentCaptures" class="recent-list">
                    <p class="empty-state">No recent captures</p>
                </div>
            </section>
        </main>

        <footer class="footer">
            <button id="openSettings" class="btn btn-ghost">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1 1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" stroke="currentColor" stroke-width="2"/>
                </svg>
                Settings
            </button>
        </footer>
    </div>

    <script src="popup.js"></script>
</body>
</html>
