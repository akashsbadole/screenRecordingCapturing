<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Recorder & Capture Pro</title>
    <link rel="stylesheet" href="popup-new.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-content">
                <img src="icons/icon32.png" alt="Icon" class="icon">
                <div class="header-text">
                    <h1>Screen Recorder Pro</h1>
                    <p class="subtitle">Professional capture & recording</p>
                </div>
            </div>
            <div class="status-indicator" id="statusIndicator">
                <div class="status-dot"></div>
                <span id="statusText">Ready</span>
            </div>
        </div>
        
        <!-- Mode Tabs -->
        <div class="mode-tabs">
            <button id="recordingTab" class="tab-btn active" data-mode="recording">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <polygon points="10,8 16,12 10,16 10,8"/>
                </svg>
                Recording
            </button>
            <button id="captureTab" class="tab-btn" data-mode="capture">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21,15 16,10 5,21"/>
                </svg>
                Capture
            </button>
            <!-- Editor Tab - Temporarily Disabled -->
            <!--
            <button id="editorTab" class="tab-btn" data-mode="editor">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </svg>
                Editor
            </button>
            -->
        </div>

        <!-- Recording Mode -->
        <div id="recordingMode" class="mode-content active">
            <div class="quick-actions">
                <button id="startRecording" class="action-btn recording" data-action="record">
                    <div class="btn-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <polygon points="10,8 16,12 10,16 10,8"/>
                        </svg>
                    </div>
                    <div class="btn-content">
                        <span class="btn-title">Start Recording</span>
                        <span class="btn-subtitle">Screen, window, or tab</span>
                    </div>
                    <div class="btn-shortcut">Ctrl+Shift+R</div>
                </button>




            </div>
        </div>

        <!-- Capture Mode -->
        <div id="captureMode" class="mode-content">
            <div class="quick-actions">
                <button id="captureScreen" class="action-btn capture" data-action="fullscreen">
                    <div class="btn-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                            <circle cx="8.5" cy="8.5" r="1.5"/>
                            <polyline points="21,15 16,10 5,21"/>
                        </svg>
                    </div>
                    <div class="btn-content">
                        <span class="btn-title">Capture Screen</span>
                        <span class="btn-subtitle">Full screen screenshot</span>
                    </div>
                    <div class="btn-shortcut">Ctrl+Shift+C</div>
                </button>

                <button id="captureArea" class="action-btn area" data-action="area">
                    <div class="btn-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                            <rect x="7" y="7" width="10" height="10"/>
                        </svg>
                    </div>
                    <div class="btn-content">
                        <span class="btn-title">Capture Area</span>
                        <span class="btn-subtitle">Select custom area</span>
                    </div>
                    <div class="btn-shortcut">Ctrl+Shift+A</div>
                </button>

                <button id="captureFullPage" class="action-btn fullpage" data-action="fullpage">
                    <div class="btn-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14,2 14,8 20,8"/>
                            <line x1="16" y1="13" x2="8" y2="13"/>
                            <line x1="16" y1="17" x2="8" y2="17"/>
                            <polyline points="10,9 9,9 8,9"/>
                        </svg>
                    </div>
                    <div class="btn-content">
                        <span class="btn-title">Full Page</span>
                        <span class="btn-subtitle">Scrolling screenshot</span>
                    </div>
                </button>

                <button id="captureDelayed" class="action-btn delayed" data-action="delayed">
                    <div class="btn-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12,6 12,12 16,14"/>
                        </svg>
                    </div>
                    <div class="btn-content">
                        <span class="btn-title">Delayed Capture</span>
                        <span class="btn-subtitle">3 second countdown</span>
                    </div>
                </button>

                <button id="captureWindow" class="action-btn window" data-action="window">
                    <div class="btn-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                            <line x1="8" y1="21" x2="16" y2="21"/>
                            <line x1="12" y1="17" x2="12" y2="21"/>
                        </svg>
                    </div>
                    <div class="btn-content">
                        <span class="btn-title">Capture Window</span>
                        <span class="btn-subtitle">Specific application window</span>
                    </div>
                </button>
            </div>
        </div>

        <!-- Recording Controls (hidden by default) -->
        <div class="recording-controls" id="recordingControls" style="display: none;">
            <div class="recording-info">
                <div class="recording-timer" id="recordingTimer">00:00</div>
                <div class="recording-size" id="recordingSize">0 MB</div>
            </div>
            <div class="recording-actions">
                <button id="pauseRecording" class="control-btn pause">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="6" y="4" width="4" height="16"/>
                        <rect x="14" y="4" width="4" height="16"/>
                    </svg>
                    Pause
                </button>
                <button id="stopRecording" class="control-btn stop">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    </svg>
                    Stop
                </button>
            </div>
        </div>
        
        <!-- Settings Panel -->
        <div class="settings-panel" id="settingsPanel">
            <div class="settings-header">
                <h3 id="settingsTitle">Recording Settings</h3>
                <button id="toggleSettings" class="toggle-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M12 1v6m0 6v6m11-7h-6m-6 0H1"/>
                    </svg>
                </button>
            </div>

            <div class="settings-content" id="settingsContent">
                <!-- Recording Settings -->
                <div id="recordingSettings" class="settings-section active">
                    <div class="setting-group">
                        <label class="setting-label">Video Quality</label>
                        <select id="videoQuality" class="setting-select">
                            <option value="720p">HD (720p)</option>
                            <option value="1080p" selected>Full HD (1080p)</option>
                            <option value="1440p">2K (1440p)</option>
                            <option value="4k">4K (2160p)</option>
                        </select>
                    </div>

                    <div class="setting-group">
                        <label class="setting-label">Frame Rate</label>
                        <select id="frameRate" class="setting-select">
                            <option value="24">24 FPS (Cinematic)</option>
                            <option value="30">30 FPS (Standard)</option>
                            <option value="60" selected>60 FPS (Smooth)</option>
                            <option value="120">120 FPS (High)</option>
                        </select>
                    </div>

                    <div class="setting-group">
                        <label class="setting-label">Output Format</label>
                        <select id="outputFormat" class="setting-select">
                            <option value="webm" selected>WebM (Recommended)</option>
                            <option value="mp4">MP4 (Compatible)</option>
                            <option value="gif">GIF (Animated)</option>
                        </select>
                    </div>

                    <div class="setting-group">
                        <div class="setting-checkbox">
                            <input type="checkbox" id="includeAudio" checked>
                            <label for="includeAudio">Include System Audio</label>
                        </div>
                    </div>

                    <div class="setting-group">
                        <div class="setting-checkbox">
                            <input type="checkbox" id="includeMicrophone">
                            <label for="includeMicrophone">Include Microphone</label>
                        </div>
                    </div>

                    <div class="setting-group">
                        <div class="setting-checkbox">
                            <input type="checkbox" id="showCursor" checked>
                            <label for="showCursor">Show Mouse Cursor</label>
                        </div>
                    </div>

                    <div class="setting-group">
                        <div class="setting-checkbox">
                            <input type="checkbox" id="highlightCursor">
                            <label for="highlightCursor">Highlight Cursor Clicks</label>
                        </div>
                    </div>



                    <div class="setting-group">
                        <div class="setting-checkbox">
                            <input type="checkbox" id="enableWatermark">
                            <label for="enableWatermark">Add Watermark</label>
                        </div>
                    </div>

                    <div class="setting-group">
                        <label class="setting-label">Watermark Text</label>
                        <input type="text" id="watermarkText" class="setting-input" placeholder="Your watermark text" value="Screen Recorder Pro">
                    </div>

                    <div class="setting-group">
                        <div class="setting-checkbox">
                            <input type="checkbox" id="enableVoiceover">
                            <label for="enableVoiceover">Enable Voiceover Recording</label>
                        </div>
                    </div>

                    <div class="setting-group">
                        <label class="setting-label">Recording Timer</label>
                        <select id="recordingTimer" class="setting-select">
                            <option value="0">No Timer</option>
                            <option value="30">30 seconds</option>
                            <option value="60">1 minute</option>
                            <option value="300">5 minutes</option>
                            <option value="600">10 minutes</option>
                            <option value="1800">30 minutes</option>
                        </select>
                    </div>
                </div>

                <!-- Capture Settings -->
                <div id="captureSettings" class="settings-section">
                    <div class="setting-group">
                        <label class="setting-label">Image Format</label>
                        <select id="imageFormat" class="setting-select">
                            <option value="png" selected>PNG (Lossless)</option>
                            <option value="jpeg">JPEG (Compressed)</option>
                            <option value="webp">WebP (Modern)</option>
                        </select>
                    </div>

                    <div class="setting-group">
                        <label class="setting-label">Image Quality</label>
                        <input type="range" id="imageQuality" min="50" max="100" value="95" class="setting-range">
                        <span class="range-value">95%</span>
                    </div>

                    <div class="setting-group">
                        <label class="setting-label">Delay Timer (seconds)</label>
                        <select id="captureDelay" class="setting-select">
                            <option value="0">No Delay</option>
                            <option value="3" selected>3 Seconds</option>
                            <option value="5">5 Seconds</option>
                            <option value="10">10 Seconds</option>
                        </select>
                    </div>

                    <div class="setting-group">
                        <div class="setting-checkbox">
                            <input type="checkbox" id="includeScrollbars">
                            <label for="includeScrollbars">Include Scrollbars</label>
                        </div>
                    </div>

                    <div class="setting-group">
                        <div class="setting-checkbox">
                            <input type="checkbox" id="autoSave" checked>
                            <label for="autoSave">Auto-save Captures</label>
                        </div>
                    </div>
                </div>

                <!-- Editor Settings - Temporarily Disabled -->

                        </div>
                    </div>
                </div>
                -->
            </div>
        </div>
        
        <!-- Footer -->
        <div class="footer">
            <div class="footer-links">
                <button id="openWebApp" class="link-btn">Open Web App</button>
                <button id="viewHistory" class="link-btn">View History</button>
            </div>
        </div>
    </div>
    
    <script src="popup-new.js"></script>
</body>
