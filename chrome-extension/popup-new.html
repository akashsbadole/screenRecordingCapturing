<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Recorder & Capture Pro</title>
    <link rel="stylesheet" href="popup-new.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-content">
                <img src="icons/icon32.png" alt="Icon" class="icon">
                <div class="header-text">
                    <h1>Screen Recorder Pro</h1>
                    <p class="subtitle">Professional capture & recording</p>
                </div>
            </div>
            <div class="status-indicator" id="statusIndicator">
                <div class="status-dot"></div>
                <span id="statusText">Ready</span>
            </div>
        </div>
        
        <!-- Quick Actions -->
        <div class="quick-actions">
            <button id="startRecording" class="action-btn recording" data-action="record">
                <div class="btn-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <polygon points="10,8 16,12 10,16 10,8"/>
                    </svg>
                </div>
                <div class="btn-content">
                    <span class="btn-title">Start Recording</span>
                    <span class="btn-subtitle">Full screen or window</span>
                </div>
                <div class="btn-shortcut">Ctrl+Shift+R</div>
            </button>
            
            <button id="captureScreen" class="action-btn capture" data-action="fullscreen">
                <div class="btn-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <polyline points="21,15 16,10 5,21"/>
                    </svg>
                </div>
                <div class="btn-content">
                    <span class="btn-title">Capture Screen</span>
                    <span class="btn-subtitle">Full screen screenshot</span>
                </div>
                <div class="btn-shortcut">Ctrl+Shift+C</div>
            </button>
            
            <button id="captureArea" class="action-btn area" data-action="area">
                <div class="btn-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                        <rect x="7" y="7" width="10" height="10"/>
                    </svg>
                </div>
                <div class="btn-content">
                    <span class="btn-title">Capture Area</span>
                    <span class="btn-subtitle">Select custom area</span>
                </div>
                <div class="btn-shortcut">Ctrl+Shift+A</div>
            </button>
        </div>
        
        <!-- Recording Controls (hidden by default) -->
        <div class="recording-controls" id="recordingControls" style="display: none;">
            <div class="recording-info">
                <div class="recording-timer" id="recordingTimer">00:00</div>
                <div class="recording-size" id="recordingSize">0 MB</div>
            </div>
            <div class="recording-actions">
                <button id="pauseRecording" class="control-btn pause">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="6" y="4" width="4" height="16"/>
                        <rect x="14" y="4" width="4" height="16"/>
                    </svg>
                    Pause
                </button>
                <button id="stopRecording" class="control-btn stop">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    </svg>
                    Stop
                </button>
            </div>
        </div>
        
        <!-- Settings Panel -->
        <div class="settings-panel" id="settingsPanel">
            <div class="settings-header">
                <h3>Recording Settings</h3>
                <button id="toggleSettings" class="toggle-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M12 1v6m0 6v6m11-7h-6m-6 0H1"/>
                    </svg>
                </button>
            </div>
            
            <div class="settings-content" id="settingsContent">
                <div class="setting-group">
                    <label class="setting-label">Video Quality</label>
                    <select id="videoQuality" class="setting-select">
                        <option value="720p">HD (720p)</option>
                        <option value="1080p" selected>Full HD (1080p)</option>
                        <option value="1440p">2K (1440p)</option>
                        <option value="4k">4K (2160p)</option>
                    </select>
                </div>
                
                <div class="setting-group">
                    <label class="setting-label">Frame Rate</label>
                    <select id="frameRate" class="setting-select">
                        <option value="30">30 FPS</option>
                        <option value="60" selected>60 FPS</option>
                    </select>
                </div>
                
                <div class="setting-group">
                    <label class="setting-label">Output Format</label>
                    <select id="outputFormat" class="setting-select">
                        <option value="webm" selected>WebM (Recommended)</option>
                        <option value="mp4">MP4</option>
                    </select>
                </div>
                
                <div class="setting-group">
                    <div class="setting-checkbox">
                        <input type="checkbox" id="includeAudio" checked>
                        <label for="includeAudio">Include System Audio</label>
                    </div>
                </div>
                
                <div class="setting-group">
                    <div class="setting-checkbox">
                        <input type="checkbox" id="includeMicrophone">
                        <label for="includeMicrophone">Include Microphone</label>
                    </div>
                </div>
                
                <div class="setting-group">
                    <div class="setting-checkbox">
                        <input type="checkbox" id="showCursor" checked>
                        <label for="showCursor">Show Mouse Cursor</label>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Footer -->
        <div class="footer">
            <div class="footer-links">
                <button id="openWebApp" class="link-btn">Open Web App</button>
                <button id="viewHistory" class="link-btn">View History</button>
            </div>
        </div>
    </div>
    
    <script src="popup-new.js"></script>
</body>
</html>
